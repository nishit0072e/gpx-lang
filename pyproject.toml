[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-compiler"
version = "0.2.0"
description = "GPX Programming Language Compiler - High performance systems compiler"
authors = [{ name = "Nishit", email = "nsihitbayen2021@gmail.com" }]
license = { text = "Proprietary. Copyright (c) 2026 Nishit. All rights reserved." }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gpx = "compiler.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compiler*"]
