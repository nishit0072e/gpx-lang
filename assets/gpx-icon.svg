<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="130" height="130">
  <defs>
    <!-- Outer Rim Metallic Gold/Bronze Gradient (Matching the screenshot's style) -->
    <radialGradient id="rim-grad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="40%" stop-color="#fda085" />
      <stop offset="70%" stop-color="#b86b3b" />
      <stop offset="100%" stop-color="#4a2611" />
    </radialGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="core-grad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1b12" />
      <stop offset="50%" stop-color="#140d09" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Neon Cyan & Amber Accents -->
    <linearGradient id="neon-wire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#fda085" flood-opacity="0.25"/>
    </filter>

    <filter id="circuit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring with Bevel Shadow -->
  <circle cx="100" cy="100" r="94" fill="url(#rim-grad)" filter="url(#badge-shadow)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2a1408" stroke-width="2"/>

  <!-- Inner Recessed Sphere -->
  <circle cx="100" cy="100" r="84" fill="url(#core-grad)"/>

  <!-- Subtle Spherical Highlight -->
  <ellipse cx="85" cy="55" rx="55" ry="30" fill="#ffffff" opacity="0.08"/>

  <!-- Schematic Silicon / Architecture Symbol -->
  <!-- Central CPU Core Box -->
  <rect x="74" y="74" width="52" height="52" rx="8" fill="#1b120c" stroke="url(#rim-grad)" stroke-width="2.5" filter="url(#circuit-glow)"/>
  
  <!-- Core Typography: 'G' -->
  <text x="100" y="112" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="34" fill="url(#rim-grad)" text-anchor="middle" letter-spacing="1">G</text>

  <!-- External Silicon Pins / Traces -->
  <!-- Top Pins -->
  <line x1="84" y1="74" x2="84" y2="46" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="84" cy="46" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>
  <line x1="100" y1="74" x2="100" y2="40" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="40" r="3.5" fill="#f6d365" filter="url(#circuit-glow)"/>
  <line x1="116" y1="74" x2="116" y2="46" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="116" cy="46" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>

  <!-- Bottom Pins -->
  <line x1="84" y1="126" x2="84" y2="154" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="84" cy="154" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>
  <line x1="100" y1="126" x2="100" y2="160" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="160" r="3.5" fill="#f6d365" filter="url(#circuit-glow)"/>
  <line x1="116" y1="126" x2="116" y2="154" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="116" cy="154" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>

  <!-- Left Pins -->
  <line x1="74" y1="88" x2="48" y2="88" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="88" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>
  <line x1="74" y1="112" x2="48" y2="112" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="112" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>

  <!-- Right Pins -->
  <line x1="126" y1="88" x2="152" y2="88" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="152" cy="88" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>
  <line x1="126" y1="112" x2="152" y2="112" stroke="url(#rim-grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="152" cy="112" r="3" fill="#00f2fe" filter="url(#circuit-glow)"/>
</svg>
